apiVersion: v1
kind: Namespace
metadata:
  name: mlops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kidney-disease-classifier
  namespace: mlops
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kidney-disease-classifier-role
  namespace: mlops
rules:
- apiGroups: [""]
  resources: ["pods", "services"]
  verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kidney-disease-classifier-rolebinding
  namespace: mlops
subjects:
- kind: ServiceAccount
  name: kidney-disease-classifier
  namespace: mlops
roleRef:
  kind: Role
  name: kidney-disease-classifier-role
  apiGroup: rbac.authorization.k8s.io